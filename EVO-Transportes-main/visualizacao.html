<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoramento Global | EVO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-[Inter] h-screen flex flex-col overflow-hidden">

  <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
    <div class="px-8 py-4 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="bg-indigo-500 p-2 rounded-lg animate-pulse">
          <i class="fa-solid fa-tower-broadcast text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold">Painel de Visualização Operacional</h1>
          <p class="text-[10px] text-slate-400 uppercase tracking-widest">Monitoramento em Tempo Real - EVO Logística</p>
        </div>
      </div>
      
      <div class="flex items-center gap-6">
        <div id="live-clock" class="text-xl font-mono font-bold text-indigo-400">00:00:00</div>
        <div class="flex items-center gap-3 border-l border-slate-700 pl-6">
          <img id="user-avatar-img" src="" class="w-8 h-8 rounded-full border border-slate-700 object-cover">
          <button id="btn-logout" class="text-slate-400 hover:text-red-400 transition-colors text-sm">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 p-6 overflow-y-auto">
    <!-- Grid de Resumo -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-8">
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs text-gray-500 font-bold uppercase">Portaria</p>
        <h3 id="count-portaria" class="text-3xl font-black text-slate-800">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm border-l-4 border-l-yellow-400">
        <p class="text-xs text-gray-500 font-bold uppercase">Aguardando Pátio</p>
        <h3 id="count-aguardando" class="text-3xl font-black text-slate-800">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm border-l-4 border-l-purple-500">
        <p class="text-xs text-gray-500 font-bold uppercase">Em Descarga</p>
        <h3 id="count-andamento" class="text-3xl font-black text-slate-800">0</h3>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm border-l-4 border-l-blue-500">
        <p class="text-xs text-gray-500 font-bold uppercase">Concluídos</p>
        <h3 id="count-concluido" class="text-3xl font-black text-slate-800">0</h3>
      </div>
      <div class="bg-indigo-600 p-4 rounded-xl shadow-lg text-white">
        <p class="text-xs text-indigo-200 font-bold uppercase">Total do Dia</p>
        <h3 id="count-total" class="text-3xl font-black">0</h3>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
        <h2 class="font-bold text-gray-700">Fluxo Logístico Ativo</h2>
      </div>
      <table class="w-full text-left">
        <thead class="text-[10px] uppercase text-gray-400 bg-gray-50">
          <tr>
            <th class="px-6 py-3">Motorista</th>
            <th class="px-6 py-3">Veículo (Placas)</th>
            <th class="px-6 py-3">Transportadora</th>
            <th class="px-6 py-3">Status Atual</th>
            <th class="px-6 py-3">Horário Ref.</th>
          </tr>
        </thead>
        <tbody id="visualizacao-body" class="divide-y divide-gray-100">
          <!-- Dados dinâmicos -->
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { db, ref, onValue } from './bd.js';
    import { checkAuth, logout } from './auth.js';

    const user = checkAuth('visualizacao');
    document.getElementById('btn-logout').addEventListener('click', logout);
    document.getElementById('user-avatar-img').src = user.avatar;

    // Relógio
    setInterval(() => {
      document.getElementById('live-clock').textContent = new Date().toLocaleTimeString();
    }, 1000);

    const statusConfig = {
      'aguardando_portaria': { label: 'Na Portaria', class: 'bg-slate-100 text-slate-600' },
      'aguardando_descarga': { label: 'No Pátio / Aguardando', class: 'bg-yellow-100 text-yellow-700' },
      'descarga_em_andamento': { label: 'Em Descarga', class: 'bg-purple-100 text-purple-700' },
      'descarga_finalizada': { label: 'Descarga Concluída', class: 'bg-blue-100 text-blue-700' },
      'liberado': { label: 'Veículo Liberado', class: 'bg-green-100 text-green-700' }
    };

    onValue(ref(db, 'transportes'), (snapshot) => {
      const tbody = document.getElementById('visualizacao-body');
      tbody.innerHTML = '';
      const data = snapshot.val();
      
      let counts = { portaria: 0, aguardando: 0, andamento: 0, concluido: 0, total: 0 };

      if (!data) return;

      Object.entries(data).reverse().forEach(([id, t]) => {
        // Filtrar por transportadora do login
        if (user.transportadora && t.transportadora !== user.transportadora) {
          return;
        }

        counts.total++;
        if (t.status === 'aguardando_portaria') counts.portaria++;
        if (t.status === 'aguardando_descarga') counts.aguardando++;
        if (t.status === 'descarga_em_andamento') counts.andamento++;
        if (t.status === 'descarga_finalizada' || t.status === 'liberado') counts.concluido++;

        const conf = statusConfig[t.status] || { label: t.status, class: 'bg-gray-100' };
        const dataHora = t.timestamp ? new Date(t.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition-colors";
        tr.innerHTML = `
          <td class="px-6 py-4 font-bold text-slate-700">${t.motorista}</td>
          <td class="px-6 py-4">
            <div class="flex gap-2">
              <span class="bg-gray-800 text-white px-2 py-0.5 rounded text-[10px] font-mono">${t.placa_carro}</span> 
            </div>
          </td>
          <td class="px-6 py-4">
            <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-bold">
              ${t.transportadora}
            </span>
          <td class="px-6 py-4">
            <span class="${conf.class} px-3 py-1 rounded-full text-xs font-bold border">
              ${conf.label}
            </span>
          </td>
          <td class="px-6 py-4 text-sm text-gray-500 font-medium">${dataHora}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('count-portaria').textContent = counts.portaria;
      document.getElementById('count-aguardando').textContent = counts.aguardando;
      document.getElementById('count-andamento').textContent = counts.andamento;
      document.getElementById('count-concluido').textContent = counts.concluido;
      document.getElementById('count-total').textContent = counts.total;
    });
  </script>
</body>
</html>
